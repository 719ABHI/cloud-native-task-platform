apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:

    metadata:
      labels:
        app: postgres

    spec:
      containers:

        - name: postgres

          image: postgres:16

          ports:
            - containerPort: 5432

          envFrom:

            - configMapRef:
                name: postgres-config

            - secretRef:
                name: postgres-secret

          # Make the persistent volume available
          # inside the PostgreSQL container.
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      # Tell the Pod that postgres-data comes
      # from our existing PVC.
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
